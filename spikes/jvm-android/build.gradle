// Private measurement app for Step 1 of the JVM mod runtime (docs/jvm-mod-runtime/status.md).
// Versions match packaging/android, which already builds in this repo's CI.
plugins {
    id 'com.android.application' version '8.7.3'
    id 'org.jetbrains.kotlin.android' version '2.0.21'
}

android {
    namespace 'dev.horizonr.jvmprobe'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.horizonr.jvmprobe'
        minSdk 28
        // Build 14 targets 35, like packaging/android (the launcher): Android 10+ blocks executing files from the app's
        // data directory for apps that target 29 or higher, and whether that stops dlopen of libjvm.so from filesDir is
        // the open question. Builds 7 to 13 targeted 28 and booted the JVM; this build shows what 35 does on the phone.
        targetSdk 35
        versionCode 1
        versionName '0.0.1-probe'
        ndk {
            abiFilters.add('arm64-v8a')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            // The auto-generated debug keystore is enough for a private APK installed from the phone's file manager.
            signingConfig signingConfigs.debug
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    lint {
        checkReleaseBuilds = false
        abortOnError = false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}
