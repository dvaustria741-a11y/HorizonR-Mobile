schema = 1
id = "horizonr_gl_lite"
name = "HorizonR GL Lite"
version = "1.0.0"
api = "0.1"
description = "Lightweight colour grade for OpenGL ES: one post pass, no extra texture reads, no depth or material stage."
authors = ["HorizonR"]
license = "MIT"

[[post]]
file = "post/grade.wgsl"
name = "Colour grade"

[[options]]
id = "saturation"
name = "Saturation"
type = "float"
default = 1.15
min = 0.0
max = 2.0
step = 0.05

[[options]]
id = "contrast"
name = "Contrast"
type = "float"
default = 1.08
min = 0.8
max = 1.4
step = 0.02

[[options]]
id = "warmth"
name = "Sun warmth"
type = "float"
default = 0.35
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "vignette"
name = "Vignette"
type = "bool"
default = false

[budget]
gpu_ms = 0.3
