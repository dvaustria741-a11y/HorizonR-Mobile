schema = 1
id = "luxium"
name = "Luxium"
version = "0.1.0"
api = "0.1"
description = "Luxium, built into HorizonR: water, metal, polished stone and glass sheen, plant wave, sky, lens flare, air distortion, filmic tonemap, light shafts and wet surfaces."
authors = ["vinlanx", "HorizonR"]
license = "Luxium Free Modification License"

[sky]
file = "sky.wgsl"
name = "Luxium sky"

[[post]]
file = "post/distort.wgsl"
name = "Air distortion"

[[post]]
file = "post/shafts.wgsl"
name = "Light shafts"

[[post]]
file = "post/flare.wgsl"
name = "Lens flare"

[[post]]
file = "post/tonemap.wgsl"
name = "Filmic tonemap"

[material]
file = "material/material.wgsl"

[[tags]]
id = "grass"
sprites = ["block/short_grass", "block/grass", "block/tall_grass_top", "block/tall_grass_bottom", "block/fern", "block/large_fern_top", "block/large_fern_bottom"]

[[tags]]
id = "leaves"
sprites = ["block/*_leaves"]

[[tags]]
id = "flowers"
sprites = ["block/dandelion", "block/poppy", "block/azure_bluet", "block/blue_orchid", "block/allium", "block/oxeye_daisy", "block/cornflower", "block/lily_of_the_valley", "block/*_tulip"]

[[tags]]
id = "water"
sprites = ["block/water_still", "block/water_flow", "block/water_overlay"]

[[tags]]
id = "aquatic"
sprites = ["block/seagrass", "block/tall_seagrass_top", "block/tall_seagrass_bottom", "block/kelp", "block/kelp_plant", "block/kelp_top"]

[[tags]]
id = "metal"
sprites = ["block/iron_block", "block/gold_block", "block/copper_block", "block/exposed_copper", "block/weathered_copper", "block/oxidized_copper", "block/cut_copper", "block/exposed_cut_copper", "block/weathered_cut_copper", "block/oxidized_cut_copper", "block/netherite_block", "block/diamond_block", "block/emerald_block", "block/lapis_block"]

[[tags]]
id = "polished"
sprites = ["block/polished_andesite", "block/polished_diorite", "block/polished_granite", "block/polished_blackstone", "block/polished_deepslate", "block/smooth_stone", "block/quartz_block_top", "block/quartz_block_side", "block/quartz_block_bottom", "block/smooth_quartz", "block/obsidian", "block/crying_obsidian"]

[[tags]]
id = "glass"
sprites = ["block/glass", "block/tinted_glass", "block/*_stained_glass"]

[[options]]
id = "shafts_on"
name = "Light shafts"
type = "bool"
default = true

[[options]]
id = "shafts_strength"
name = "Shaft strength"
type = "float"
default = 0.35
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "tm_strength"
name = "Tonemap strength"
type = "float"
default = 1.0
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "tm_exposure"
name = "Exposure (EV)"
type = "float"
default = 0.0
min = -1.5
max = 1.5
step = 0.1

[[options]]
id = "tm_contrast"
name = "Contrast"
type = "float"
default = 0.35
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "tm_highlights"
name = "Highlight compression"
type = "float"
default = 0.5
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "tm_shadow_depth"
name = "Shadow depth"
type = "float"
default = 0.4
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "tm_saturation"
name = "Saturation"
type = "float"
default = 1.05
min = 0.5
max = 1.5
step = 0.05

[[options]]
id = "tm_vibrance"
name = "Vibrance"
type = "float"
default = 0.2
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "wet_on"
name = "Wet surfaces in rain"
type = "bool"
default = true

[[options]]
id = "sky_on"
name = "Luxium sky"
type = "bool"
default = true

[[options]]
id = "sky_strength"
name = "Sky strength"
type = "float"
default = 0.85
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "flare_on"
name = "Lens flare"
type = "bool"
default = true

[[options]]
id = "flare_intensity"
name = "Flare intensity"
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.1

[[options]]
id = "flare_ghosts"
name = "Flare ghosts"
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.1

[[options]]
id = "flare_streak"
name = "Flare streak"
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.1

[[options]]
id = "warp_on"
name = "Air warp (set by /luxium warp)"
type = "bool"
default = false

[[options]]
id = "warp_cx"
name = "Warp X"
type = "float"
default = 0.0
min = -30000000.0
max = 30000000.0
step = 0.01

[[options]]
id = "warp_cy"
name = "Warp Y"
type = "float"
default = 0.0
min = -4096.0
max = 4096.0
step = 0.01

[[options]]
id = "warp_cz"
name = "Warp Z"
type = "float"
default = 0.0
min = -30000000.0
max = 30000000.0
step = 0.01

[[options]]
id = "warp_r"
name = "Warp radius"
type = "float"
default = 8.0
min = 2.0
max = 64.0
step = 0.5

[[options]]
id = "wave_on"
name = "Plant wave"
type = "bool"
default = true

[[options]]
id = "wave_strength"
name = "Plant wave strength"
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.1

[[options]]
id = "wave_speed"
name = "Plant wave speed"
type = "float"
default = 1.0
min = 0.2
max = 3.0
step = 0.1

[[options]]
id = "water_on"
name = "Water surface"
type = "bool"
default = true

[[options]]
id = "water_strength"
name = "Water reflection strength"
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.1

[budget]
gpu_ms = 2.0

[[options]]
id = "metal_on"
name = "Metal reflections"
type = "bool"
default = true

[[options]]
id = "metal_strength"
name = "Metal strength"
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.1

[[options]]
id = "polish_on"
name = "Polished stone"
type = "bool"
default = true

[[options]]
id = "glass_on"
name = "Glass sheen"
type = "bool"
default = true
