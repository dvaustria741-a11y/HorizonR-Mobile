name: Build HorizonZ Launcher APK

on:
  push:
    branches: [ "main", "master", "android", "native-mods-punchy", "upstream-shader-handler", "controls-overlay", "controls-overlay-fps" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master", "android" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-update-zip:
    name: Auto-Extract Update/ ZIP to Main Source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check & Extract Any ZIP in Update/ Folder Over Main Source
        continue-on-error: true
        run: |
          set +e
          for zf in Update/*.zip; do
            if [ -f "$zf" ]; then
              unzip -q -o "$zf" "scripts/*" || true
            fi
          done
          python3 scripts/apply_update_zip.py
          if [ -f ".auto_update_applied.txt" ]; then
            APPLIED_ZIPS="$(cat .auto_update_applied.txt)"
            rm -f .auto_update_applied.txt
            git checkout HEAD -- .github/workflows/ 2>/dev/null || true
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git reset HEAD .github/workflows/ 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -m "chore(auto-update): extract ${APPLIED_ZIPS} from Update/ into main source" || true
              git push origin "HEAD:${GITHUB_REF_NAME}" || true
            fi
          fi
          exit 0

  build-horizonz-apk:
    name: Build HorizonZ APK (${{ matrix.abi }})
    needs: apply-update-zip
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            rust_target: aarch64-linux-android
            clang_prefix: aarch64-linux-android28
          - abi: armeabi-v7a
            rust_target: armv7-linux-androideabi
            clang_prefix: armv7a-linux-androideabi28

    steps:
      - name: Checkout Latest Main Source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Compute App Version
        run: |
          echo "APP_VERSION=$(sh scripts/app-version.sh ${{ github.run_number }})" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=1000000" >> "$GITHUB_ENV"

      - name: Ensure Any Remaining Update/ ZIP is Applied in Build Workspace
        run: |
          for zf in Update/*.zip; do
            if [ -f "$zf" ]; then
              unzip -q -o "$zf" "scripts/*" || true
            fi
          done
          python3 scripts/apply_update_zip.py
          rm -f .auto_update_applied.txt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK & Install Platform 35 + NDK 28.2.13676358
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_HOME" > packaging/android/local.properties

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          fi
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"

          NDK_VERSION="28.2.13676358"
          NDK_DIR="$ANDROID_HOME/ndk/$NDK_VERSION"
          for attempt in 1 2 3; do
            if [ -f "$NDK_DIR/source.properties" ]; then
              break
            fi
            if "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "ndk;$NDK_VERSION" && [ -f "$NDK_DIR/source.properties" ]; then
              break
            fi
            rm -rf "$NDK_DIR" "$ANDROID_HOME/temp"
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep "$((attempt * 10))"
          done
          test -f "$NDK_DIR/source.properties"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Set up Rust Toolchain (${{ matrix.rust_target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Apply HorizonR patches to the vendored engine (crates/ in this repo)
        run: |
          # The Vasysik/horizon-android engine is vendored in this repo (crates/, Cargo.toml, third_party/...),
          # so edits to crates/ are what get built. No upstream clone/rsync happens any more.
          # The patch script is idempotent (verified): it re-checks include assets, the AI agent bits,
          # the optional native mods stage and the auto-jump server input fix.
          python3 scripts/patch_horizon_direct_boot.py
          rm -f packaging/android/assets/bedrock-controls.json

          rustup target add "${{ matrix.rust_target }}"

      - name: Apply native mods (native-mods/*.hnmod)
        run: |
          # Mixin bundles patch the engine source before it is compiled. If the patched engine does
          # not compile, the build step below reverts them and builds the plain engine.
          python3 scripts/apply_native_mods.py apply

      - name: Cache Rust Engine Build
        uses: Swatinem/rust-cache@v2
        with:
          key: horizon-real-engine-v16-${{ matrix.rust_target }}

      - name: Compile Real Horizon Rust Engine (libhorizon_android.so) & Prestage Controls (${{ matrix.abi }})
        run: |
          mkdir -p .local/android/gradle-jni/${{ matrix.abi }}
          mkdir -p .local/android/gradle-assets
          cp -f LICENSE .local/android/gradle-assets/LICENSE.txt || cp -f LICENSE.txt .local/android/gradle-assets/LICENSE.txt || true
          cp -f THIRD_PARTY_NOTICES.md .local/android/gradle-assets/ || true

          APK_URL_076="https://github.com/Vasysik/horizon-android/releases/download/v0.7.6/Horizon-Android-0.7.6-${{ matrix.abi }}.apk"
          APK_URL_075="https://github.com/Vasysik/horizon-android/releases/download/v0.7.5/Horizon-Android-0.7.5-${{ matrix.abi }}.apk"
          APK_URL_074="https://github.com/Vasysik/horizon-android/releases/download/v0.7.4/Horizon-Android-0.7.4-${{ matrix.abi }}.apk"
          if curl -fsSL -L "$APK_URL_076" -o /tmp/upstream_assets.apk || curl -fsSL -L "$APK_URL_075" -o /tmp/upstream_assets.apk || curl -fsSL -L "$APK_URL_074" -o /tmp/upstream_assets.apk; then
            unzip -q -o /tmp/upstream_assets.apk "assets/*" -d /tmp/upstream_assets_dir || true
            if [ -d "/tmp/upstream_assets_dir/assets" ]; then
              cp -rf /tmp/upstream_assets_dir/assets/* .local/android/gradle-assets/ || true
            fi
            rm -rf /tmp/upstream_assets.apk /tmp/upstream_assets_dir
          fi

          python3 scripts/prestage_controls_and_wallpapers.py

          TOOLCHAIN_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export PATH="$TOOLCHAIN_BIN:$PATH"
          export HORIZON_ANDROID_PUBLIC=1
          export HORIZON_ANDROID_BUILD_COMMIT="$(git rev-parse --short=12 HEAD 2>/dev/null || echo 'horizonz20')"
          export HORIZON_ANDROID_BUILD_DIRTY="false"
          export CARGO_PROFILE_RELEASE_LTO=false
          export CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16
          export CARGO_PROFILE_RELEASE_OPT_LEVEL=2

          TRIPLE_UNDERSCORE="$(echo "${{ matrix.rust_target }}" | tr '-' '_')"
          TRIPLE_UPPER="$(echo "$TRIPLE_UNDERSCORE" | tr '[:lower:]' '[:upper:]')"
          export "CC_${TRIPLE_UNDERSCORE}=$TOOLCHAIN_BIN/${{ matrix.clang_prefix }}-clang"
          export "CXX_${TRIPLE_UNDERSCORE}=$TOOLCHAIN_BIN/${{ matrix.clang_prefix }}-clang++"
          export "AR_${TRIPLE_UNDERSCORE}=$TOOLCHAIN_BIN/llvm-ar"
          export "CARGO_TARGET_${TRIPLE_UPPER}_LINKER=$TOOLCHAIN_BIN/${{ matrix.clang_prefix }}-clang"

          EXTRA_CARGO_ARGS=""
          if [ "${{ matrix.abi }}" = "armeabi-v7a" ]; then
            EXTRA_CARGO_ARGS="--no-default-features --features audio"
          fi

          set +e
          cargo build --release -p horizon-android --target ${{ matrix.rust_target }} $EXTRA_CARGO_ARGS 2>&1 | tee cargo_build.log
          CARGO_EXIT=${PIPESTATUS[0]}
          if [ "$CARGO_EXIT" -ne 0 ] && [ -f /tmp/native-mods-backup/manifest.json ]; then
            echo "::warning::Native mods did not compile; rebuilding the plain engine without them"
            tail -n 60 cargo_build.log >> "$GITHUB_STEP_SUMMARY"
            python3 scripts/apply_native_mods.py revert
            cargo build --release -p horizon-android --target ${{ matrix.rust_target }} $EXTRA_CARGO_ARGS 2>&1 | tee cargo_build.log
            CARGO_EXIT=${PIPESTATUS[0]}
          fi
          if [ "$CARGO_EXIT" -ne 0 ]; then
            tail -n 120 cargo_build.log >> "$GITHUB_STEP_SUMMARY"
            exit "$CARGO_EXIT"
          fi

          cp -f "target/${{ matrix.rust_target }}/release/libhorizon_android.so" ".local/android/gradle-jni/${{ matrix.abi }}/libhorizon_android.so"
          "$TOOLCHAIN_BIN/llvm-strip" --strip-unneeded ".local/android/gradle-jni/${{ matrix.abi }}/libhorizon_android.so" || true
          ls -lh ".local/android/gradle-jni/${{ matrix.abi }}/libhorizon_android.so"

      - name: Save compiler errors to ci-errors branch
        if: failure() && github.ref_name == 'upstream-shader-handler'
        continue-on-error: true
        run: |
          [ -f cargo_build.log ] || exit 0
          sed -E 's/\x1b\[[0-9;]*[A-Za-z]//g' cargo_build.log > /tmp/clean.log
          { grep -E -A14 '^error' /tmp/clean.log | head -2500; echo; echo '=== TAIL ==='; tail -60 /tmp/clean.log; } > /tmp/errs.txt || true
          grep -cE '^error' /tmp/clean.log > /tmp/errcount.txt || true
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git fetch origin ci-errors:ci-errors 2>/dev/null || git branch ci-errors
          git checkout -q ci-errors 2>/dev/null || git checkout -q --orphan ci-errors
          mkdir -p errs; cp /tmp/errs.txt errs/${{ matrix.abi }}.txt; cp /tmp/errcount.txt errs/${{ matrix.abi }}.count
          git add errs/; git -c core.hooksPath=/dev/null commit -q -m "errors ${{ github.sha }} ${{ matrix.abi }}" || true
          git push origin HEAD:ci-errors || (git pull --rebase origin ci-errors && git push origin HEAD:ci-errors) || true
      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restore Signing Keystore & Assemble APK (${{ matrix.abi }})
        working-directory: packaging/android
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          set +e
          gradle assembleRelease -Pabi=${{ matrix.abi }} -PminSdk=28 -PappVersionName="$APP_VERSION" -PappVersionCode="$APP_VERSION_CODE" --no-daemon --stacktrace 2>&1 | tee gradle_build.log
          GRADLE_EXIT=${PIPESTATUS[0]}
          if [ "$GRADLE_EXIT" -ne 0 ]; then
            tail -n 120 gradle_build.log >> "$GITHUB_STEP_SUMMARY"
            exit "$GRADLE_EXIT"
          fi
          mkdir -p ../../dist
          APK_FOUND="$(find build/outputs/apk/release ../../.local/android/gradle-build/outputs/apk/release -name "*.apk" 2>/dev/null | head -n 1)"
          cp -f "$APK_FOUND" "../../dist/HorizonZ-Launcher-${APP_VERSION}-${{ matrix.abi }}.apk"
          ls -lh ../../dist/

      - name: Upload APK Artifact (${{ matrix.abi }})
        uses: actions/upload-artifact@v4
        with:
          name: HorizonZ-Launcher-${{ env.APP_VERSION }}-${{ matrix.abi }}
          path: dist/HorizonZ-Launcher-${{ env.APP_VERSION }}-${{ matrix.abi }}.apk
          if-no-files-found: error

  publish-release:
    name: Publish HorizonZ Release APKs
    needs: build-horizonz-apk
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Source & History
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Compute App Version
        run: |
          echo "APP_VERSION=$(sh scripts/app-version.sh ${{ github.run_number }})" >> "$GITHUB_ENV"

      - name: Download All Built APK Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-apks
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: release-apks
        run: |
          sha256sum *.apk > SHA256SUMS.txt
          ls -lh

      - name: Generate Release Notes From Commits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --tags --force || true
          PREV_TAG="$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)"
          if [ -n "$PREV_TAG" ] && git rev-parse -q --verify "refs/tags/${PREV_TAG}" > /dev/null; then
            RANGE="${PREV_TAG}..HEAD"
          else
            RANGE="-n 15"
          fi
          git log $RANGE --no-merges --pretty='%s' \
            | grep -v -i -E '^(chore\(auto-update\)|ci(\(|:))' \
            | sed -E 's/^(feat|feature|add|update)(\([^)]*\))?: *//I' > all_subjects.txt || true
          grep -i -E '^(fix|bugfix|hotfix)' all_subjects.txt > fixed.txt || true
          grep -v -i -E '^(fix|bugfix|hotfix)' all_subjects.txt > new.txt || true
          {
            echo "## What's New in v${APP_VERSION}"
            if [ -s new.txt ]; then sed 's/^/- /' new.txt; else echo "- No new features in this build."; fi
            echo
            echo "## Fixed"
            if [ -s fixed.txt ]; then sed 's/^/- /' fixed.txt; else echo "- No fixes in this build."; fi
            echo
            echo "SHA256 checksums for the APKs are in SHA256SUMS.txt."
          } > release-notes.md
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: horizonz-v${{ env.APP_VERSION }}
          name: "HorizonZ - Launcher v${{ env.APP_VERSION }}"
          body_path: release-notes.md
          files: |
            release-apks/*.apk
            release-apks/SHA256SUMS.txt
          prerelease: false
          make_latest: true
