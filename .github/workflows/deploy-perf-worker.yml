name: Deploy Cloud Performance Profile worker

on:
  workflow_dispatch:
  push:
    branches: [launcher-ui-desktop]
    paths:
      - "cloud/worker/**"
      - ".github/workflows/deploy-perf-worker.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloud/worker
          command: deploy
