name: Vanilla parity ledger

# Reads the vanilla game's methods against Horizon's Rust and lists the gaps. Nothing from Mojang is
# committed or uploaded: the jars are fetched into the runner, and only the ledger's own reports leave it.
on:
  push:
    branches: [ "launcher-ui-volt-style" ]
    paths:
      - ".github/workflows/parity-ledger.yml"
      - "tools/ci_vanilla_stage.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ledger:
    name: Build the parity ledger
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch the pinned game files from Mojang
        run: python3 tools/ci_vanilla_stage.py --out "$RUNNER_TEMP/minecraft"

      - name: Prepare
        run: >
          python3 tools/lab.py prepare
          --minecraft-dir "$RUNNER_TEMP/minecraft"
          --server-jar "$RUNNER_TEMP/minecraft/server.jar"

      - name: Decompile
        run: |
          rc=0
          python3 tools/lab.py decompile --side both --threads 3 --heap 6G || rc=$?
          # 2 = decompiled, but some files carry decompiler error markers: the ledger still reads the rest
          [ "$rc" -eq 0 ] || [ "$rc" -eq 2 ]

      - name: Build the ledger
        run: python3 tools/port_ledger.py build

      - name: Reports
        run: |
          mkdir -p out
          python3 tools/port_ledger.py report > /dev/null
          cp .local/port-ledger/report.md out/report.md
          python3 tools/port_ledger.py coverage --depth 3 > out/coverage.txt
          python3 tools/port_ledger.py gaps --limit 200 > out/gaps.txt
          python3 tools/port_ledger.py todo --limit 150 > out/todo.txt
          {
            echo "## Parity gaps (first 120 lines)"
            echo '```'
            head -n 120 out/gaps.txt
            echo '```'
            echo "## Coverage"
            echo '```'
            head -n 80 out/coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: parity-ledger
          path: out/
